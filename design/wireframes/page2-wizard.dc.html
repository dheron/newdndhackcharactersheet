<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wizard page two</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fff}
a{color:#111}a:hover{color:#444}
.pg *{box-sizing:border-box}
.l{font:400 10px/12px Arial,Helvetica,sans-serif;color:#444;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-align:center}
.b{border:1.5px solid #111;background:#fff}
.op{font:700 15px Arial,Helvetica,sans-serif;padding-top:14px;width:10px;text-align:center}
.bx{border:1.5px solid #111;display:flex;flex-direction:column}
.bh{background:#333;color:#fff;padding:0 6px;height:24px;font:700 12px/24px Arial,Helvetica,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.sb{display:flex;align-items:center;gap:3px;height:18px;padding:0 6px;border-bottom:1px solid #111;font:400 9px Arial,Helvetica,sans-serif;text-transform:uppercase;color:#444}
.sb .t{margin-right:2px}
.sq{width:10px;height:10px;border:1.2px solid #111}
.rw{display:flex;align-items:flex-end;gap:5px;height:20px;padding:0 6px}
.ck{width:10px;height:10px;border:1.2px solid #111;flex:none;margin-bottom:3px}
.nm{flex:1;border-bottom:1px solid #999;height:19px}
</style>
</helmet>
<div class="pg" style="width:816px;height:1056px;box-sizing:border-box;padding:40px;display:flex;flex-direction:column;gap:12px;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif">

<div style="border:1.5px solid #111;padding:6px 8px;display:flex;align-items:flex-start;gap:6px">
<div style="flex:2"><div class="l">Name</div><div class="b" style="height:30px"></div></div>
<div style="flex:1.6"><div class="l">Class and level</div><div class="b" style="height:30px"></div></div>
<div style="width:10px"></div>
<div style="width:48px"><div class="l">Spell atk</div><div class="b" style="height:30px;border-width:3px"></div></div>
<div class="op">=</div>
<div style="width:36px"><div class="l">Base</div><div class="b" style="height:30px"></div></div>
<div class="op">+</div>
<div style="width:36px"><div class="l">INT</div><div class="b" style="height:30px"></div></div>
<div class="op">+</div>
<div style="width:36px"><div class="l">Misc</div><div class="b" style="height:30px"></div></div>
<div style="width:10px"></div>
<div style="width:84px"><div class="l">Arcane potency</div><div class="b" style="height:30px;border-width:3px"></div></div>
</div>

<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;flex:1;min-height:0">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{c.boxes}}" as="bx" hint-placeholder-count="3">
<div class="bx">
<div class="bh">{{bx.title}}</div>
<sc-if value="{{bx.hasSlots}}" hint-placeholder-val="{{true}}"><div class="sb"><span class="t">Slots</span><sc-for list="{{bx.slots}}" as="s" hint-placeholder-count="5"><div class="sq"></div></sc-for><span class="t" style="margin-left:12px">Spent</span><sc-for list="{{bx.slots}}" as="s" hint-placeholder-count="5"><div class="sq"></div></sc-for></div></sc-if>
<sc-for list="{{bx.rows}}" as="r" hint-placeholder-count="8"><div class="rw"><div class="ck"></div><div class="nm"></div></div></sc-for>
<div style="height:4px"></div>
</div>
</sc-for>
</div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":816,"height":1056}}'>
class Component extends DCLogic {
renderVals() {
const mk = (title, rows, slots) => ({
title,
rows: Array.from({ length: rows }, (_, i) => ({ i })),
slots: Array.from({ length: slots }, (_, i) => ({ i })),
hasSlots: slots > 0
});
const cols = [
{ boxes: [mk('Cantrips', 5, 0), mk('1st level', 17, 5), mk('2nd level', 15, 5)] },
{ boxes: [mk('3rd level', 13, 5), mk('4th level', 12, 5), mk('5th level', 11, 5)] },
{ boxes: [mk('6th level', 10, 4), mk('7th level', 9, 3), mk('8th level', 8, 3), mk('9th level', 6, 2)] }
];
return { cols };
}
}
</script>
</body>
</html>
