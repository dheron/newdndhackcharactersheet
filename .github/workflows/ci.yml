name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Rules data and report are up to date
        run: |
          npm run rules
          git diff --exit-code -- src/rules/data docs/rules-report.md

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-path: src-tauri/target/universal-apple-darwin/release/bundle
          - name: Windows
            os: windows-latest
            args: ""
            rust-targets: ""
            bundle-path: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: character-sheet-${{ matrix.name }}
          path: |
            ${{ matrix.bundle-path }}/dmg/*.dmg
            ${{ matrix.bundle-path }}/msi/*.msi
            ${{ matrix.bundle-path }}/nsis/*.exe
          if-no-files-found: error
