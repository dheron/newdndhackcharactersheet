# Publishes the web version to GitHub Pages: https://dheron.github.io/newdndhackcharactersheet/
# Runs on every push to the repository's default branch, or by hand from the Actions tab ("Run workflow").
# One-time setup in the repository: Settings, Pages, Source: GitHub Actions.
name: Web version

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only the default branch is published.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          # The Google OAuth client ID for Drive sync (a public identifier, not a secret).
          # Set it in Settings, Secrets and variables, Actions, Variables. See docs/google-drive-setup.md.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_BUILD_ID: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
